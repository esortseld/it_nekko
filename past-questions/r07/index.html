<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>令和7年度公開問題 | ITネッコ</title>
  <meta name="description" content="令和7年度ITパスポート公開問題を、問番号と分野から確認する索引です。">
  <link rel="stylesheet" href="../../assets/style.css">
  <style>
    .item-card{display:block;min-height:7rem;padding:1rem 1.05rem;border:1px solid var(--color-border,#d9d3c8);border-radius:14px;background:#faf9f6;color:inherit;text-decoration:none}
    .jump-links{display:flex;flex-wrap:wrap;gap:.55rem;margin:0 0 1.4rem}
    .jump-links a{display:inline-block;padding:.55rem .8rem;border:1px solid var(--color-border,#d9d3c8);border-radius:999px;background:#fff;text-decoration:none;color:inherit;font-size:.9rem}
    .q-mini-wrap{margin:1.2rem 0 2rem}
    .q-mini-grid{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:.28rem}
    .q-mini{display:flex;align-items:center;justify-content:center;min-height:1.75rem;padding:.18rem .1rem;border:1px solid var(--color-border,#d9d3c8);border-radius:6px;background:#fff;color:inherit;font-size:.72rem;line-height:1}
    @media(max-width:900px){.q-mini-grid{grid-template-columns:repeat(10,minmax(0,1fr))}}
    @media(max-width:520px){.q-mini-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
  </style>
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="../../">ITネッコ</a>
    <nav class="site-nav" aria-label="主要ページ">
      <a href="../../">トップ</a>
      <a href="../../past-questions/">過去問</a>
      <a href="../../about/">このサイトについて</a>
    </nav>
  </div>
</header>
<main>
  <section class="page-hero"><div class="container hero-inner"><p class="site-kicker">R07</p><h1>令和7年度公開問題</h1></div></section>
  <div class="container page-flow">
    <a class="back-link" href="../">過去問一覧へ戻る</a>

    <section class="q-mini-wrap" aria-labelledby="question-no-index">
      <div class="section-heading"><div><h2 id="question-no-index">問番号から探す</h2></div></div>
      <div class="q-mini-grid" id="question-mini-grid"></div>
    </section>

    <nav class="jump-links" aria-label="分野へ移動">
      <a href="#strategy">ストラテジ系</a>
      <a href="#management">マネジメント系</a>
      <a href="#technology">テクノロジ系</a>
    </nav>

    <section id="strategy">
      <div class="section-heading"><div><p class="section-kicker">Strategy</p><h2>ストラテジ系</h2></div></div>
      <div class="card-grid"><div class="item-card" aria-hidden="true"></div></div>
    </section>

    <section id="management">
      <div class="section-heading"><div><p class="section-kicker">Management</p><h2>マネジメント系</h2></div></div>
      <div class="card-grid"><div class="item-card" aria-hidden="true"></div></div>
    </section>

    <section id="technology">
      <div class="section-heading"><div><p class="section-kicker">Technology</p><h2>テクノロジ系</h2></div></div>
      <div class="card-grid"><div class="item-card" aria-hidden="true"></div></div>
    </section>
  </div>
</main>
<footer class="site-footer"><div class="container"><p>ITネッコ / のらネコ学習室</p></div></footer>
<script>
document.getElementById('question-mini-grid').innerHTML=Array.from({length:100},(_,i)=>`<span class="q-mini">${i+1}</span>`).join('');
</script>
</body>
</html>
