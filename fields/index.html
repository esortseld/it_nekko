<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>学習分野 | ITネッコ</title>
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    .field-card{display:block;padding:1.2rem 1.25rem;border:1px solid var(--color-border,#d9d3c8);border-radius:16px;background:#fff;color:inherit;text-decoration:none}
    .field-card:hover{transform:translateY(-1px)}
    .field-card .card-label{display:block;margin-bottom:.35rem}
    .field-card h2{margin:0;font-size:1.15rem;line-height:1.5}
  </style>
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="../">ITネッコ</a>
    <nav class="site-nav" aria-label="主要ページ">
      <a href="../">トップ</a>
      <a href="../past-questions/">過去問</a>
      <a href="../about/">このサイトについて</a>
    </nav>
  </div>
</header>

<main>
  <section class="page-hero">
    <div class="container hero-inner">
      <p class="site-kicker">Fields</p>
      <h1>学習分野</h1>
    </div>
  </section>

  <div class="container page-flow">
    <a class="back-link" href="../">トップへ戻る</a>

    <div class="card-grid card-grid--three">
      <a class="field-card" href="strategy/">
        <span class="card-label">Strategy</span>
        <h2>ストラテジ系</h2>
      </a>
      <a class="field-card" href="management/">
        <span class="card-label">Management</span>
        <h2>マネジメント系</h2>
      </a>
      <a class="field-card" href="technology/">
        <span class="card-label">Technology</span>
        <h2>テクノロジ系</h2>
      </a>
    </div>
  </div>

<footer class="site-footer"><div class="container"><p>ITネッコ / のらネコ学習室</p></div></footer>

</html>
