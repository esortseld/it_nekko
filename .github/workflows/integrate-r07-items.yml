name: Integrate R07 item pages

on:
  push:
    branches: [main]
    paths:
      - 'scripts/integrate_r07_items.py'
      - '.github/workflows/integrate-r07-items.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Integrate R07 items sequentially
        run: python scripts/integrate_r07_items.py
