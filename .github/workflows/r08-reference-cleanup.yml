name: R8 link label update

on:
  push:
    branches:
      - batch-r08-reference-cleanup

permissions:
  contents: write

jobs:
  update-label:
    if: github.event.head_commit.message == 'Trigger R8 link label update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch-r08-reference-cleanup
          fetch-depth: 0
      - name: Update R8 official PDF link labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          INDEX = Path('past-questions/r08/index.html')
          OLD = 'IPA公式 公開問題（PDF）'
          NEW = 'IPA公式 令和8年度 ITパスポート試験 公開問題'
          PDF = 'https://www3.jitec.ipa.go.jp/JitesCbt/html/openinfo/pdf/questions/2026r08_ip_qs.pdf'

          index = INDEX.read_text(encoding='utf-8')
          pairs = []
          for m in re.finditer(r'<a class="question-card" href="\.\./\.\./topics/([^/]+)/">\s*<span class="card-label">問(\d+)</span>', index):
              q = int(m.group(2))
              if 1 <= q <= 54:
                  pairs.append((q, m.group(1)))
          pairs.sort()
          assert [q for q, _ in pairs] == list(range(1, 55)), 'R8 Q1-Q54 mapping incomplete'
          slugs = list(dict.fromkeys(slug for _, slug in pairs))
          assert len(slugs) == 52, f'Expected 52 unique topic files, got {len(slugs)}'

          changed = []
          for slug in slugs:
              path = Path('topics') / slug / 'index.html'
              text = path.read_text(encoding='utf-8')
              assert PDF in text, f'{path}: R8 PDF URL missing'
              assert text.count(OLD) == 1, f'{path}: expected exactly one old label, got {text.count(OLD)}'
              updated = text.replace(OLD, NEW, 1)
              assert OLD not in updated, f'{path}: old label remains'
              assert updated.count(NEW) == 1, f'{path}: new label count invalid'
              path.write_text(updated, encoding='utf-8')
              changed.append(str(path))

          status = subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()
          modified = {line[3:] for line in status if line and line[3:] != '.tmp-r08-trigger'}
          expected = {f'topics/{slug}/index.html' for slug in slugs}
          assert modified == expected, f'Unexpected diff scope: extra={modified-expected}, missing={expected-modified}'
          print(f'R8 entries checked: {len(pairs)}')
          print(f'Unique topic files changed: {len(changed)}')
          PY
      - name: Commit topic-only changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topics/*/index.html
          git commit -m "Update R8 official problem link labels"
          git push origin HEAD:batch-r08-reference-cleanup
