name: R8 reference cleanup

on:
  push:
    branches:
      - batch-r08-reference-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Add temporary R8 reference cleanup workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch-r08-reference-cleanup
          fetch-depth: 0
      - name: Apply scoped changes and verify
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys

          INDEX = Path('past-questions/r08/index.html')
          PDF = 'https://www3.jitec.ipa.go.jp/JitesCbt/html/openinfo/pdf/questions/2026r08_ip_qs.pdf'
          LINK = f'<p><a href="{PDF}" target="_blank" rel="noopener noreferrer">IPA公式 公開問題（PDF）</a></p>'

          index = INDEX.read_text(encoding='utf-8')
          pairs = []
          for m in re.finditer(r'<a class="question-card" href="\.\./\.\./topics/([^/]+)/">\s*<span class="card-label">問(\d+)</span>', index):
              slug, q = m.group(1), int(m.group(2))
              if 1 <= q <= 54:
                  pairs.append((q, slug))
          pairs.sort()
          assert [q for q, _ in pairs] == list(range(1, 55)), f'Question mapping incomplete: {[q for q,_ in pairs]}'
          slugs = list(dict.fromkeys(slug for _, slug in pairs))
          assert len(slugs) == 52, f'Expected 52 unique topic targets, got {len(slugs)}'

          changed = []
          audit = []
          hero_re = re.compile(r'(<section class="page-hero">.*?<h1>.*?</h1>)\s*<p class="page-description">.*?</p>', re.S)
          ref_re = re.compile(r'(<section class="detail-section"><h2>参照した公開問題</h2>)(.*?)(</section>)', re.S)
          p_re = re.compile(r'<p(?:\s[^>]*)?>.*?</p>', re.S)

          def text_only(html):
              return re.sub(r'<[^>]+>', '', html).strip()

          for slug in slugs:
              path = Path('topics') / slug / 'index.html'
              assert path.exists(), f'Missing topic file: {path}'
              before = path.read_text(encoding='utf-8')
              after, nhero = hero_re.subn(r'\1', before, count=1)
              assert nhero == 1, f'{path}: title-adjacent page-description not found exactly once'

              def fix_ref(m):
                  prefix, body, suffix = m.groups()
                  ps = list(p_re.finditer(body))
                  r8_idxs = [i for i, pm in enumerate(ps) if re.search(r'令和8年度\s*ITパスポート試験\s*公開問題\s*問', text_only(pm.group(0)))]
                  assert r8_idxs, f'{path}: R8 question paragraph not found in reference section'
                  last = r8_idxs[-1]
                  candidate = None
                  for i in range(last + 1, len(ps)):
                      txt = text_only(ps[i].group(0))
                      if re.search(r'令和\d+年度\s*ITパスポート試験\s*公開問題\s*問', txt):
                          continue
                      if 'IPA公式 公開問題（PDF）' in txt:
                          candidate = i
                          break
                      candidate = i
                      break
                  if candidate is not None:
                      pm = ps[candidate]
                      new_body = body[:pm.start()] + LINK + body[pm.end():]
                  else:
                      pm = ps[last]
                      new_body = body[:pm.end()] + LINK + body[pm.end():]
                  return prefix + new_body + suffix

              after2, nref = ref_re.subn(fix_ref, after, count=1)
              assert nref == 1, f'{path}: reference section not found exactly once'
              after = after2
              assert after != before, f'{path}: no change produced'
              # Required postconditions.
              hero = re.search(r'<section class="page-hero">.*?</section>', after, re.S).group(0)
              assert 'page-description' not in hero, f'{path}: hero description remains'
              ref = ref_re.search(after).group(0)
              assert '令和8年度 ITパスポート試験 公開問題 問' in ref, f'{path}: R8 question number missing'
              assert PDF in ref and 'IPA公式 公開問題（PDF）' in ref, f'{path}: official PDF link missing'

              path.write_text(after, encoding='utf-8')
              changed.append(str(path))
              audit.append((slug, nhero, nref))

          # Scope gate: only the 52 unique target topic files may change besides this temporary workflow.
          status = subprocess.check_output(['git','status','--porcelain'], text=True).splitlines()
          modified = {line[3:] for line in status if line and not line.endswith('.github/workflows/r08-reference-cleanup.yml')}
          expected = {f'topics/{s}/index.html' for s in slugs}
          assert modified == expected, f'Unexpected changed paths. extra={modified-expected}, missing={expected-modified}'

          print(f'R8 entries: {len(pairs)}')
          print(f'Unique topic files: {len(slugs)}')
          print(f'Changed topic files: {len(changed)}')
          print('Duplicate mappings:', [(q,s) for q,s in pairs if sum(1 for _,x in pairs if x==s)>1])
          PY
      - name: Commit scoped topic changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topics/*/index.html
          git commit -m "Apply R8 topic reference cleanup"
          git push origin HEAD:batch-r08-reference-cleanup
