<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITネッコ</title>
  <meta name="description" content="ITパスポート試験の過去問と学習分野から、対応する学習ページへ進むための入口です。">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .home-route-grid{display:grid;grid-template-columns:1fr;gap:1rem}
    .home-route-card{display:block;padding:1.4rem;border:1px solid var(--color-border,#d9d3c8);border-radius:18px;background:#fff;color:inherit}
    .home-route-card h2{margin:.25rem 0 1rem;font-size:1.35rem}
    .home-route-card h2 a{color:inherit;text-decoration:none}
    .home-route-card h2 a:hover{text-decoration:underline}
    .home-route-card .route-arrow{display:block;margin-top:1rem;font-weight:700}
    .quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}
    .quick-link{display:block;padding:1rem;border:1px solid var(--color-border,#d9d3c8);border-radius:14px;background:#fff;text-decoration:none;color:inherit}
    .quick-link strong{display:block;margin-bottom:.25rem}
    .past-question-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    @media(max-width:720px){.quick-grid,.past-question-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="./" aria-label="ITネッコ トップへ">ITネッコ</a>
      <nav class="site-nav" aria-label="主要ページ">
        <a href="./">トップ</a>
        <a href="past-questions/">過去問</a>
        <a href="about/">このサイトについて</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="site-hero">
      <div class="container hero-inner">
        <p class="site-kicker">のらネコ学習室 / IT Passport</p>
        <h1>ITネッコ</h1>
      </div>
    </section>

    <div class="container page-flow">
      <section>
        <div class="home-route-grid">
          <div class="home-route-card">
            <h2><a href="past-questions/">過去問から探す</a></h2>
            <div class="quick-grid past-question-grid">
              <a class="quick-link" href="past-questions/r08/"><strong>令和8年度</strong><span>問1〜100</span></a>
              <a class="quick-link" href="past-questions/r07/"><strong>令和7年度</strong><span>過去問</span></a>
            </div>
          </div>
        </div>
      </section>

      <section aria-labelledby="fields-direct">
        <div class="section-heading">
          <div><h2 id="fields-direct">学習分野</h2></div>
          <a class="text-link" href="fields/">一覧へ</a>
        </div>
        <div class="quick-grid">
          <a class="quick-link" href="fields/strategy/"><strong>ストラテジ系</strong><span>項目1〜24</span></a>
          <a class="quick-link" href="fields/management/"><strong>マネジメント系</strong><span>項目25〜32</span></a>
          <a class="quick-link" href="fields/technology/"><strong>テクノロジ系</strong><span>項目33〜63</span></a>
        </div>
      </section>

      <section>
        <div class="home-route-grid">
          <a class="home-route-card" href="fields/" style="text-decoration:none;">
            <span class="card-label">学習する</span>
            <h2>学習分野から進む</h2>
            <span class="route-arrow">学習分野へ →</span>
          </a>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container"><p>ITネッコ / のらネコ学習室</p></div>
  </footer>
</body>
</html>
