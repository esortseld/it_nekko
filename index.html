<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITネッコ</title>
  <meta name="description" content="ITパスポート試験を、過去問と学習分野の二つの入口から体系的・実生活に沿って学ぶサイトです。">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .home-route-grid{display:grid;grid-template-columns:1fr;gap:1rem}
    .home-route-card{display:block;padding:1.4rem;border:1px solid var(--color-border,#d9d3c8);border-radius:18px;background:#fff;color:inherit}
    .home-route-card h2{margin:.25rem 0 1rem;font-size:1.35rem}
    .home-route-card h2 a{color:inherit;text-decoration:none}
    .home-route-card h2 a:hover{text-decoration:underline}
    .quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}
    .quick-link{display:block;padding:1rem;border:1px solid var(--color-border,#d9d3c8);border-radius:14px;background:#fff;text-decoration:none;color:inherit}
    .quick-link strong{display:block}
    .past-question-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .site-hero .hero-description{margin:.65rem 0 0;max-width:38rem;line-height:1.7}

    .field-list{display:grid;gap:.9rem}
    .field-row{display:grid;grid-template-columns:minmax(180px,270px) 1fr;align-items:center;gap:1.2rem}
    .field-name{display:block;padding:.8rem 1rem;border:1px solid var(--color-border,#d9d3c8);border-radius:14px;background:#fff;color:inherit;text-decoration:none;font-weight:700;font-size:1.08rem}
    .field-name:hover{text-decoration:underline}
    .field-description{margin:0;line-height:1.65}

    @media(max-width:720px){
      .quick-grid,.past-question-grid{grid-template-columns:1fr}
      .field-row{grid-template-columns:1fr;gap:.45rem}
      .field-name{width:100%;box-sizing:border-box}
      .field-description{padding:0 .15rem .2rem}
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="./" aria-label="ITネッコ トップへ">ITネッコ</a>
      <nav class="site-nav" aria-label="主要ページ">
        <a href="./">トップ</a>
        <a href="past-questions/">過去問</a>
        <a href="fields/">学習分野</a>
        <a href="about/">このサイトについて</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="site-hero">
      <div class="container hero-inner">
        <p class="site-kicker">のらネコ学習室 / IT Passport</p>
        <h1>ITネッコ</h1>
        <p class="hero-description">ITパスポート試験を体系的・実生活に沿って学びます</p>
      </div>
    </section>

    <div class="container page-flow">
      <section>
        <div class="home-route-grid">
          <div class="home-route-card">
            <h2><a href="past-questions/">過去問から学ぶ</a></h2>
            <div class="quick-grid past-question-grid">
              <a class="quick-link" href="past-questions/r08/"><strong>令和8年度</strong></a>
              <a class="quick-link" href="past-questions/r07/"><strong>令和7年度</strong></a>
            </div>
          </div>
        </div>
      </section>

      <section>
        <div class="home-route-grid">
          <div class="home-route-card">
            <h2><a href="fields/">学習分野から学ぶ</a></h2>
            <div class="field-list">
              <div class="field-row">
                <a class="field-name" href="fields/strategy/">ストラテジ系</a>
                <p class="field-description">会社や仕事にITを生かす</p>
              </div>
              <div class="field-row">
                <a class="field-name" href="fields/management/">マネジメント系</a>
                <p class="field-description">ITの開発と運用を進める</p>
              </div>
              <div class="field-row">
                <a class="field-name" href="fields/technology/">テクノロジ系</a>
                <p class="field-description">ITを支える技術と仕組みを知る</p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container"><p>ITネッコ / のらネコ学習室</p></div>
  </footer>
</body>
</html>
